# Baseline Validation Workflow Configuration
# =========================================
#
# New Sampling change document: the quota-sampled baseline against the stratified sampler
# with catalogue-allocated weights. Both runs are the _15 publications in the RESBLDG
# account, database `resstock-core`, registered by telescope's athena_tables step as
# `<dataset>_md_agg_national_parquet` (per-building metadata, carrying the allocated
# `weight`) and `<dataset>_ts_by_state` (per-building timeseries).
#
# The two differ only in sampler and weighting; engine, options layer and weather are the
# same, so every gap between the series is the sampling step.

workgroup: rescore

data_sources:
  - db_name: resstock-core
    table_name: new_samp_t0_amy2018_2_15
    name: resstock_baseline
    db_schema: resstock_oedi_agg
    baseline_metadata_and_annual_results_parquet_url: s3://resstock-core/new_sampling/new_sampling_test_0_amy2018_2_15_output/metadata_and_annual_results_aggregates/national/full/parquet/upgrade0_agg.parquet
  - db_name: resstock-core
    table_name: new_samp_t4_15
    name: resstock_new_sampling
    db_schema: resstock_oedi_agg
    baseline_metadata_and_annual_results_parquet_url: s3://resstock-core/new_sampling/new_sampling_test_4_15_output/metadata_and_annual_results_aggregates/national/full/parquet/upgrade0_agg.parquet

reference_years:
  eia:
    - 2018
  recs:
    - 2020

# No LRD. The utility-grain comparison maps buildings to utilities through an eiaid weights
# table in the run's own Athena database, which `resstock-core` does not have, and it joins
# on an allocated county column, which this publication does not carry - only
# `in.as_simulated_county`, the county the building was simulated in. A utility-grain
# comparison built on that would describe the simulated buildings rather than the dwelling
# units they stand for, which is the opposite of what this change document is checking.
comparison_datasets:
  - eia
  - recs

output:
  output_dir: ~/baseline_validation_outputs
  run_name: new_sampling_baseline_vs_new

# Data Source Labels
# ------------------
# Keys must match the 'source' column values in plot data.
data_source_labels:
  eia_2018:
    label: "EIA 2018"
    entries:
      - description: "EIA-861 Annual Electric Utility Data (2018)"
        url: "https://www.eia.gov/electricity/data/eia861/"
      - description: "EIA-861M Monthly Electric Power Industry Report (2018)"
        url: "https://www.eia.gov/electricity/data/eia861m/"
      - description: "EIA-176 Natural Gas Consumption Data (2018)"
        url: "https://www.eia.gov/dnav/ng/ng_cons_sum_a_EPG0_vrs_mmcf_m.htm"
  recs_2020:
    label: "RECS 2020"
    entries:
      - description: "Residential Energy Consumption Survey 2020"
        url: "https://www.eia.gov/consumption/residential/"
  resstock_baseline:
    label: "Baseline"
    entries:
      - description: "new_sampling_test_0_amy2018_2_15 - quota sampler, uniform weights"
        url: "https://resstock.nlr.gov/"
  resstock_new_sampling:
    label: "New"
    entries:
      - description: "new_sampling_test_4_15 - stratified sampler, catalogue-allocated weights"
        url: "https://resstock.nlr.gov/"
  lrd_2018:
    label: "LRD 2018"
    entries:
      - description: "Utility Load Research Data 2018"
        url: ""
