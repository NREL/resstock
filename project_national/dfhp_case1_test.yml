schema_version: '0.4'
os_version: 3.10.0
os_sha: 86d7e215a1
buildstock_directory: ../ # Relative to this file or absolute
project_directory: project_national # Relative to buildstock_directory
output_directory: dfhp_case1_test
weather_files_url: https://data.nlr.gov/system/files/156/Buildstock_TMY3_FIPS-1678817889.zip
# weather_files_path: c:/OpenStudio/BuildStock_TMY3_FIPS.zip # Local weather files example
# weather_files_path: /kfs2/shared-projects/buildstock/weather/BuildStock_TMY3_FIPS.zip # Kestrel TMY3 weather files
# weather_files_path: /kfs2/shared-projects/buildstock/weather/BuildStock_2018_FIPS.zip # Kestrel 2018 weather files

# Baseline number of units
baseline:
  n_buildings_represented: 139647020 # American Community Survey 2021 5-year, B25001, does not include territories ( 138765649 without AK and HI )

# Sampler type and number of data points per baseline or upgrade
sampler:
  type: residential_quota
  args:
    n_datapoints: 250

# NLR High Performance Computing machine configuration
# Not used if running buildstock_local (local tests and CI)
# kestrel:
#   n_jobs: 3
#   minutes_per_sim: 30
#   account: <account>
#   postprocessing:
#     time: 20
#     n_workers: 1
#     n_procs: 20
#   sampling:
#     time: 5

# Post proccessing and Amazon Web Services
# postprocessing:
#   # Post simulation partitioning
#   keep_individual_timeseries: true
#   partition_columns:
#     - State
#     - County
#   # AWS upload bucket and athena setup (uncomment during production and testing runs)
#   aws:
#    region_name: us-west-2
#    s3:
#      bucket: sdr_resstock
#      prefix: production_runs
#    athena:
#      glue_service_role: service-role/AWSGlueServiceRole-default
#      database_name: sdr_resstock
#      max_crawling_time: 1200

# Workflow generator
workflow_generator:
  # ResStock HPXML workflow generator
  type: residential_hpxml
  version: 2026.10.05
  args:
    # Annual simulation and timestep
    build_existing_model:
      simulation_control_timestep: 60
      simulation_control_run_period_begin_month: 1
      simulation_control_run_period_begin_day_of_month: 1
      simulation_control_run_period_end_month: 12
      simulation_control_run_period_end_day_of_month: 31
      simulation_control_run_period_calendar_year: 2007

    # Emissions scenarios
    emissions:
      - scenario_name: LRMER_MidCase_15
        type: CO2e
        elec_folder: data/emissions/cambium/2024/LRMER_MidCase_15

    # Utility bill rates
    utility_bills:
      - scenario_name: Bills

    # Outputs to include
    simulation_output_report:
      include_annual_emission_end_uses: true
      timeseries_frequency: hourly
      include_timeseries_total_consumptions: true
      include_timeseries_fuel_consumptions: true
      include_timeseries_end_use_consumptions: true
      include_timeseries_emissions: true
      include_timeseries_emission_fuels: true
      include_timeseries_emission_end_uses: true
      include_timeseries_hot_water_uses: true
      include_timeseries_total_loads: true
      include_timeseries_component_loads: false
      include_timeseries_unmet_hours: true
      include_timeseries_zone_temperatures: true
      include_timeseries_zone_conditions: true
      include_timeseries_airflows: true
      include_timeseries_weather: true
      include_timeseries_resilience: true

    # Other reporting measures to run
    reporting_measures:
      - measure_dir_name: QOIReport

    # Files to keep
    server_directory_cleanup:
      retain_schedules_csv: false

# YAML anchors reused by the upgrades below
references:
  # Ducted dwellings heated by natural gas, propane, or fuel oil, excluding shared hydronic systems
  dual_fuel_package_apply_logic: &dual_fuel_package_apply_logic
    - HVAC Has Ducts|Yes
    - not:
      - or:
        - HVAC Shared Efficiencies|Boiler Baseboards Heating Only, Electricity
        - HVAC Shared Efficiencies|Boiler Baseboards Heating Only, Fuel
        - HVAC Shared Efficiencies|Fan Coil Heating and Cooling, Electricity
        - HVAC Shared Efficiencies|Fan Coil Heating and Cooling, Fuel
        - HVAC Shared Efficiencies|Fan Coil Cooling Only
    - or:
      - Heating Fuel|Natural Gas
      - Heating Fuel|Propane
      - Heating Fuel|Fuel Oil

  heat_pump_cooling_efficiency_ducted: &heat_pump_cooling_efficiency_ducted
    option: HVAC Cooling Efficiency|Ducted Heat Pump

  partial_conditioning_100_percent: &partial_conditioning_100_percent
    option: HVAC Cooling Partial Space Conditioning|100% Conditioned

  remove_secondary_ducted_heating: &remove_secondary_ducted_heating
    option: HVAC Secondary Heating Efficiency|None
    apply_logic:
      - HVAC Secondary Heating Type|Ducted Heating

# Dual fuel heat pump scenarios: backup fuel matches the existing heating fuel
upgrades:
  - upgrade_name: Dual Fuel Heat Pump, 50F Compressor Lockout
    package_apply_logic: *dual_fuel_package_apply_logic
    options:
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE NG, 50F compressor lockout
        apply_logic:
          - Heating Fuel|Natural Gas
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE Propane, 50F compressor lockout
        apply_logic:
          - Heating Fuel|Propane
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 83% AFUE Fuel Oil, 50F compressor lockout
        apply_logic:
          - Heating Fuel|Fuel Oil
      - *heat_pump_cooling_efficiency_ducted
      - *partial_conditioning_100_percent
      - *remove_secondary_ducted_heating

  - upgrade_name: Dual Fuel Heat Pump, 30F Compressor Lockout
    package_apply_logic: *dual_fuel_package_apply_logic
    options:
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE NG, 30F compressor lockout
        apply_logic:
          - Heating Fuel|Natural Gas
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE Propane, 30F compressor lockout
        apply_logic:
          - Heating Fuel|Propane
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 83% AFUE Fuel Oil, 30F compressor lockout
        apply_logic:
          - Heating Fuel|Fuel Oil
      - *heat_pump_cooling_efficiency_ducted
      - *partial_conditioning_100_percent
      - *remove_secondary_ducted_heating

  - upgrade_name: Dual Fuel Heat Pump, 10F Compressor Lockout
    package_apply_logic: *dual_fuel_package_apply_logic
    options:
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE NG, 10F compressor lockout
        apply_logic:
          - Heating Fuel|Natural Gas
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE Propane, 10F compressor lockout
        apply_logic:
          - Heating Fuel|Propane
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 83% AFUE Fuel Oil, 10F compressor lockout
        apply_logic:
          - Heating Fuel|Fuel Oil
      - *heat_pump_cooling_efficiency_ducted
      - *partial_conditioning_100_percent
      - *remove_secondary_ducted_heating

  - upgrade_name: Dual Fuel Heat Pump, -10F Compressor Lockout
    package_apply_logic: *dual_fuel_package_apply_logic
    options:
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE NG, -10F compressor lockout
        apply_logic:
          - Heating Fuel|Natural Gas
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 80% AFUE Propane, -10F compressor lockout
        apply_logic:
          - Heating Fuel|Propane
      - option: HVAC Heating Efficiency|Dual-Fuel ASHP, SEER2 15.2, 7.8 HSPF2, Integrated Backup, 83% AFUE Fuel Oil, -10F compressor lockout
        apply_logic:
          - Heating Fuel|Fuel Oil
      - *heat_pump_cooling_efficiency_ducted
      - *partial_conditioning_100_percent
      - *remove_secondary_ducted_heating
